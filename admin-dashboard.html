<!DOCTYPE html>

<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Aanwezigheid</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        \\* {

            -webkit-tap-highlight-color: transparent;

        }

        body {

            margin: 0;

            padding: 0;

            overflow-x: hidden;

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

        }

        .gradient-bg {

            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);

            min-height: 100vh;

            position: relative;

        }

        .gradient-bg::before {

            content: '';

            position: fixed;

            top: 0;

            left: 0;

            right: 0;

            bottom: 0;

            background: radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.2) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 50%);

            pointer-events: none;

        }

        .glass-card {

            background: rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.08);

        }

        .glass-card-strong {

            background: rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(30px);

            -webkit-backdrop-filter: blur(30px);

            border: 1px solid rgba(255, 255, 255, 0.1);

        }

        .bottom-nav {

            background: rgba(30, 41, 59, 0.8);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border-top: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.3);

        }

        .nav-item {

            transition: all 0.3s ease;

        }

        .nav-item:hover {

            background: rgba(255, 255, 255, 0.05);

        }

        .nav-item:active {

            transform: scale(0.95);

        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(10px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

        .animate-fade-in {

            animation: fadeIn 0.3s ease-out;

        }

        html {

            scroll-behavior: smooth;

        }

        ::-webkit-scrollbar {

            width: 8px;

        }

        ::-webkit-scrollbar-track {

            background: rgba(255, 255, 255, 0.02);

            border-radius: 4px;

        }

        ::-webkit-scrollbar-thumb {

            background: rgba(255, 255, 255, 0.1);

            border-radius: 4px;

        }

        ::-webkit-scrollbar-thumb:hover {

            background: rgba(255, 255, 255, 0.15);

        }

    </style>

</head>

<body>

    <div id="app"></div>

    <script type="module">

        import { initializeApp } from "https://www\.gstatic.com/firebasejs/10.12.0/firebase-app.js";

        import { getFirestore, collection, getDocs, getDoc, addDoc, setDoc, updateDoc, deleteDoc, doc, Timestamp } from "https://www\.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        import {

            getAuth,

            signInWithEmailAndPassword,

            signOut,

            onAuthStateChanged

        } from "https://www\.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ====================================

        // FIREBASE CONFIG — vul jouw gegevens in

        // ====================================

        const firebaseConfig = {

            apiKey: "AIzaSyD9w-uzVhuvfIR5_UH-xcMKJPAlpx5fKRk",

            authDomain: "aanwezigheid-app.firebaseapp.com",

            projectId: "aanwezigheid-app",

            storageBucket: "aanwezigheid-app.firebasestorage.app",

            messagingSenderId: "188437676924",

            appId: "1:188437676924:web:194eb53f7c6eb40ec3daf9",

            measurementId: "G-V8WM335NFL"

        };

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const auth = getAuth(app);

        // ====================================

        // STATE

        // ====================================

        let selectedAdmin = null;

        let activeTab = 'employees';

        let medewerkers = [];

        let mededelingen = [];

        let verjaardagen = [];
        let editingBirthday = null;
        let birthdayPreview = [];

        let editingEmployee = null;

        let editingAnnouncement = null;

        let message = null;

        // ====================================

        // FIREBASE FUNCTIES

        // ====================================

        async function fetchData() {

            try {

                const [medSnap, meddSnap, birthdaySnap] = await Promise.all([

                    getDocs(collection(db, 'accounts')),

                    getDocs(collection(db, 'mededelingen')),
                    getDocs(collection(db, 'verjaardagen'))

                ]);

                medewerkers = medSnap.docs

                    .map(d => ({ id: d.id, uid: d.id, ...d.data() }))

                    .filter(m => m.displayName && m.role !== 'display');

                mededelingen = meddSnap.docs.map(d => ({ id: d.id, ...d.data(), datum: d.data().datum?.toDate() }));
                verjaardagen = birthdaySnap.docs.map(d => ({ id: d.id, ...d.data() }));

                render();

            } catch (error) {

                console.error('Fetch error:', error);

                showMessage('error', 'Kon data niet laden');

            }

        }

        async function saveEmployee(employee) {

            try {

                if (!employee.uid) {

                    showMessage('error', 'Firebase UID ontbreekt');

                    return;

                }

                const medewerkerRef = doc(db, 'accounts', employee.uid);

                await setDoc(medewerkerRef, {

                    displayName: employee.displayName,

                    functie: employee.functie,

                    role: employee.role || 'staff',

                    zichtbaar: employee.zichtbaar ?? true

                });

                showMessage(

                    'success',

                    employee.id ? 'Medewerker bijgewerkt' : 'Medewerker toegevoegd'

                );

                editingEmployee = null;

                await fetchData();

            } catch (error) {

                console.error('Save error:', error);

                showMessage('error', 'Kon medewerker niet opslaan');

            }

        }

        async function deleteEmployee(id) {

            if (!confirm('Weet je zeker dat je deze medewerker wilt verwijderen?')) return;

            try {

                await Promise.all([

                    deleteDoc(doc(db, 'accounts', id)),

                    deleteDoc(doc(db, 'actuele_status', id))

                ]);

                showMessage('success', 'Medewerker verwijderd');

                await fetchData();

            } catch (error) {

                showMessage('error', 'Kon medewerker niet verwijderen');

            }

        }

        async function toggleEmployeeVisibility(employee) {

            try {

                await updateDoc(doc(db, 'accounts', employee.id), { zichtbaar: !employee.zichtbaar });

                showMessage('success', 'Zichtbaarheid aangepast');

                await fetchData();

            } catch (error) {

                showMessage('error', 'Kon zichtbaarheid niet wijzigen');

            }

        }

        async function saveAnnouncement(announcement) {

            try {

                if (announcement.id) {

                    await updateDoc(doc(db, 'mededelingen', announcement.id), {

                        titel: announcement.titel,

                        bericht: announcement.bericht,

                        prioriteit: announcement.prioriteit,

                        actief: announcement.actief

                    });

                    showMessage('success', 'Mededeling bijgewerkt');

                } else {

                    await addDoc(collection(db, 'mededelingen'), {

                        titel: announcement.titel,

                        bericht: announcement.bericht,

                        prioriteit: announcement.prioriteit || 'Normaal',

                        actief: announcement.actief ?? true,

                        datum: Timestamp.fromDate(new Date())

                    });

                    showMessage('success', 'Mededeling toegevoegd');

                }

                editingAnnouncement = null;

                await fetchData();

            } catch (error) {

                showMessage('error', 'Kon mededeling niet opslaan');

            }

        }

        async function deleteAnnouncement(id) {

            if (!confirm('Weet je zeker dat je deze mededeling wilt verwijderen?')) return;

            try {

                await deleteDoc(doc(db, 'mededelingen', id));

                showMessage('success', 'Mededeling verwijderd');

                await fetchData();

            } catch (error) {

                showMessage('error', 'Kon mededeling niet verwijderen');

            }

        }

        async function toggleAnnouncementActive(announcement) {

            try {

                await updateDoc(doc(db, 'mededelingen', announcement.id), { actief: !announcement.actief });

                showMessage('success', 'Status aangepast');

                await fetchData();

            } catch (error) {

                showMessage('error', 'Kon status niet wijzigen');

            }

        }

        async function loginAdmin() {

            const email = document.getElementById('admin-email').value.trim();

            const password = document.getElementById('admin-password').value;

            if (!email || !password) {

                showMessage('error', 'Vul je e-mailadres en wachtwoord in');

                return;

            }

            try {

                await signInWithEmailAndPassword(auth, email, password);

            } catch (error) {

                console.error('Login error:', error);

                showMessage('error', 'Inloggen mislukt');

            }

        }

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                selectedAdmin = null;

                render();

                return;

            }

            try {

                const medewerkerSnapshot = await getDoc(doc(db, 'accounts', user.uid));

                if (!medewerkerSnapshot.exists() || medewerkerSnapshot.data().role !== 'admin') {

                    console.warn('Ingelogde gebruiker heeft geen adminrol');

                    await signOut(auth);

                    selectedAdmin = null;

                    showMessage('error', 'Dit account heeft geen beheerdersrechten');

                    return;

                }

                const medewerkerData = medewerkerSnapshot.data();

                selectedAdmin = {

                    naam: medewerkerData.displayName || 'Admin',

                    email: user.email,

                    uid: user.uid

                };

                await fetchData();

            } catch (error) {

                console.error('Controle adminrol mislukt:', error);

                selectedAdmin = null;

                showMessage('error', 'Beheerdersrechten konden niet worden gecontroleerd');

            }

        });

        // ====================================

        // UI HELPERS — globaal zodat inline onclick werkt

        // ====================================


        function validBirthday(naam, dag, maand) {
            const n = String(naam || '').trim();
            const d = Number(dag), m = Number(maand);
            if (!n || n.length > 80 || !Number.isInteger(d) || !Number.isInteger(m) || m < 1 || m > 12) return false;
            const max = new Date(2024, m, 0).getDate();
            return d >= 1 && d <= max;
        }

        async function saveBirthday() {
            const naam = document.getElementById('birthday-name').value.trim();
            const dag = Number(document.getElementById('birthday-day').value);
            const maand = Number(document.getElementById('birthday-month').value);
            if (!validBirthday(naam, dag, maand)) { alert('Controleer de voornaam en datum.'); return; }
            try {
                if (editingBirthday?.id) {
                    await setDoc(doc(db, 'verjaardagen', editingBirthday.id), {naam, dag, maand});
                } else {
                    await addDoc(collection(db, 'verjaardagen'), {naam, dag, maand});
                }
                editingBirthday = null;
                await fetchData();
            } catch (e) { console.error(e); alert('Opslaan mislukt. Controleer je beheerdersrechten.'); }
        }

        async function removeBirthday(id) {
            if (!confirm('Deze verjaardag verwijderen?')) return;
            try { await deleteDoc(doc(db, 'verjaardagen', id)); await fetchData(); }
            catch (e) { console.error(e); alert('Verwijderen mislukt.'); }
        }

        function parseBirthdays(text) {
            const records = [], errors = [];
            const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
            lines.forEach((line, i) => {
                const s = line.trim();
                if (!s || s.startsWith('#')) return;
                let match = s.match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-]\d{2,4})?\s*[,;|\t ]+\s*(.+)$/);
                let naam, dag, maand;
                if (match) { dag = Number(match[1]); maand = Number(match[2]); naam = match[3].trim(); }
                else {
                    match = s.match(/^(.+?)\s*[,;|\t]+\s*(\d{1,2})[.\/-](\d{1,2})(?:[.\/-]\d{2,4})?$/);
                    if (match) { naam = match[1].trim(); dag = Number(match[2]); maand = Number(match[3]); }
                }
                if (!match || !validBirthday(naam, dag, maand)) { errors.push(i + 1); return; }
                records.push({naam, dag, maand});
            });
            return {records, errors};
        }

        async function loadBirthdayFile(input) {
            const file = input.files?.[0];
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.txt') || file.size > 1024 * 1024) {
                alert('Kies een .txt-bestand van maximaal 1 MB.'); input.value = ''; return;
            }
            const parsed = parseBirthdays(await file.text());
            birthdayPreview = parsed.records;
            if (parsed.errors.length) alert('Ongeldige regels: ' + parsed.errors.slice(0, 25).join(', ') + '. Deze regels worden overgeslagen.');
            render();
        }

        async function importBirthdays() {
            if (!birthdayPreview.length) return;
            const existing = new Set(verjaardagen.map(v => [v.naam.trim().toLocaleLowerCase('nl'), v.dag, v.maand].join('|')));
            const unique = birthdayPreview.filter(v => {
                const key = [v.naam.trim().toLocaleLowerCase('nl'), v.dag, v.maand].join('|');
                if (existing.has(key)) return false;
                existing.add(key);
                return true;
            });
            if (!unique.length) { alert('Geen nieuwe verjaardagen gevonden.'); return; }
            if (!confirm(unique.length + ' verjaardagen toevoegen aan Firebase?')) return;
            let count = 0;
            try {
                for (const v of unique) { await addDoc(collection(db, 'verjaardagen'), v); count++; }
                birthdayPreview = [];
                await fetchData();
                alert(count + ' verjaardagen geïmporteerd.');
            } catch (e) {
                console.error(e); await fetchData();
                alert(count + ' verjaardagen toegevoegd; daarna is de import gestopt. Probeer de import opnieuw om de rest toe te voegen.');
            }
        }

        function renderBirthdaysTab() {
            const escape = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            const b = editingBirthday || {naam:'', dag:'', maand:''};
            const rows = [...verjaardagen].sort((a,z) => a.maand-z.maand || a.dag-z.dag || a.naam.localeCompare(z.naam,'nl'));
            const maanden = ['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
            const datum = v => String(v.dag).padStart(2,'0') + '-' + String(v.maand).padStart(2,'0');
            return `<div class="space-y-6">
              <section id="birthday-editor" class="glass-card rounded-2xl p-5"><h2 class="text-xl font-bold mb-3">🎂 ${editingBirthday ? 'Verjaardag wijzigen' : 'Verjaardagen beheren'}</h2>
                <p class="text-slate-300 text-sm mb-4">Alleen voornaam, dag en maand worden opgeslagen in Firebase.</p>
                <div class="grid sm:grid-cols-4 gap-3">
                  <input id="birthday-name" placeholder="Voornaam" value="${escape(b.naam)}" maxlength="80" class="glass-card rounded-xl px-3 py-3 text-white">
                  <input id="birthday-day" type="number" min="1" max="31" placeholder="Dag" value="${escape(b.dag)}" class="glass-card rounded-xl px-3 py-3 text-white">
                  <input id="birthday-month" type="number" min="1" max="12" placeholder="Maand" value="${escape(b.maand)}" class="glass-card rounded-xl px-3 py-3 text-white">
                  <button onclick="window._adminFns.saveBirthday()" class="rounded-xl bg-purple-600 px-4 py-3 font-semibold">${editingBirthday ? 'Wijziging opslaan' : 'Verjaardag toevoegen'}</button>
                </div>
                ${editingBirthday ? '<button class="mt-3 text-sm underline" onclick="window._adminFns.cancelBirthday()">Annuleren</button>' : ''}
              </section>
              <section class="glass-card rounded-2xl p-5"><h3 class="text-lg font-bold mb-3">Eerste batch importeren (.txt)</h3>
                <p class="text-slate-300 text-sm mb-3">Gebruik per regel bijvoorbeeld <code>12-04; Emma</code> of <code>Emma; 12-04</code>. Een geboortejaar in het bestand wordt genegeerd.</p>
                <input type="file" accept=".txt,text/plain" onchange="window._adminFns.loadBirthdayFile(this)" class="block w-full text-sm mb-4">
                ${birthdayPreview.length ? `<p class="mb-2 font-semibold">${birthdayPreview.length} regels gevonden (voorbeeld):</p>
                <div class="max-h-48 overflow-y-auto text-sm mb-3">${birthdayPreview.slice(0,100).map(v=>`<div class="grid grid-cols-[minmax(0,1fr)_6rem] gap-3 border-b border-white/10 py-1"><span>${escape(v.naam)}</span><span class="tabular-nums">${datum(v)}</span></div>`).join('')}</div>
                ${birthdayPreview.length>100 ? '<p class="text-xs mb-3">Alleen de eerste 100 regels worden getoond.</p>' : ''}
                <button onclick="window._adminFns.importBirthdays()" class="bg-green-700 rounded-xl px-4 py-3 font-semibold">Gecontroleerde verjaardagen importeren</button>` : '<p class="text-slate-400 text-sm">Nog geen bestand geselecteerd.</p>'}
              </section>
              <section class="glass-card rounded-2xl p-5"><h3 class="text-lg font-bold mb-3">Opgeslagen verjaardagen (${rows.length})</h3>
                <div class="overflow-x-auto"><table class="w-full min-w-[340px] text-left text-sm border-collapse"><thead><tr class="text-slate-300 border-b border-white/20"><th scope="col" class="px-3 py-3 font-semibold">Naam</th><th scope="col" class="px-3 py-3 font-semibold w-28">Datum</th><th scope="col" class="px-3 py-3 font-semibold w-36 text-right">Acties</th></tr></thead><tbody>${maanden.map((maand, i) => { const lijst = rows.filter(v => v.maand === i + 1); return `<tr class="bg-purple-500/15"><th colspan="3" scope="rowgroup" class="px-3 py-3 text-purple-200 font-bold">${maand} ${lijst.length ? '('+lijst.length+')' : ''}</th></tr>${lijst.map(v => `<tr class="border-b border-white/10 hover:bg-white/5"><td class="px-3 py-3 break-words">${escape(v.naam)}</td><td class="px-3 py-3 tabular-nums whitespace-nowrap">${datum(v)}</td><td class="px-3 py-3 text-right whitespace-nowrap"><button class="text-blue-300 underline mr-3" onclick="window._adminFns.editBirthday('${v.id}')">Wijzig</button><button class="text-red-300 underline" onclick="window._adminFns.removeBirthday('${v.id}')">Verwijder</button></td></tr>`).join('')}`; }).join('')}</tbody></table></div>
              </section></div>`;
        }

        window._adminFns = {

            setTab: (tab) => { activeTab = tab; render(); },

            login: loginAdmin,

            logout: async () => {

                await signOut(auth);

            },

            editEmployee: (id) => {
                editingEmployee = id
                    ? medewerkers.find(m => m.id === id) || null
                    : { id: null, displayName: '', functie: '', role: 'staff', zichtbaar: true };
                if (!editingEmployee) { alert('Medewerker niet gevonden. Vernieuw de pagina.'); return; }
                render();
                const input = document.getElementById('emp-displayName');
                if (input) {
                    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    input.focus({ preventScroll: true });
                }
            },

            cancelEmployee: () => { editingEmployee = null; render(); },

            saveEmployee: (id) => {

                saveEmployee({

                    id: id || null,

                    uid: id || document.getElementById('emp-uid').value.trim(),

                    displayName: document.getElementById('emp-displayName').value.trim(),

                    functie: document.getElementById('emp-functie').value.trim(),

                    role: document.getElementById('emp-role').value,

                    zichtbaar: document.getElementById('emp-zichtbaar').checked

                });

            },

            deleteEmployee,

            toggleVisibility: (id) => { const emp = medewerkers.find(m => m.id === id); if (emp) toggleEmployeeVisibility(emp); },

            editAnnouncement: (ann) => { editingAnnouncement = ann ? JSON.parse(ann) : { titel: '', bericht: '', prioriteit: 'Normaal', actief: true }; render(); },

            cancelAnnouncement: () => { editingAnnouncement = null; render(); },

            saveAnnouncement: (id) => {

                saveAnnouncement({

                    id: id || null,

                    titel: document.getElementById('ann-titel').value,

                    bericht: document.getElementById('ann-bericht').value,

                    prioriteit: document.getElementById('ann-prioriteit').value,

                    actief: document.getElementById('ann-actief').checked

                });

            },

            deleteAnnouncement,

            toggleActive: (ann) => toggleAnnouncementActive(JSON.parse(ann)),
            saveBirthday,
            removeBirthday,
            editBirthday: id => {
                editingBirthday = verjaardagen.find(v => v.id === id) || null;
                if (!editingBirthday) { alert('Verjaardag niet gevonden. Vernieuw de pagina.'); return; }
                render();
                const input = document.getElementById('birthday-name');
                if (input) {
                    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    input.focus({ preventScroll: true });
                    input.select();
                }
            },
            cancelBirthday: () => { editingBirthday = null; render(); },
            loadBirthdayFile,
            importBirthdays

        };

        function showMessage(type, text) {

            message = { type, text };

            render();

            setTimeout(() => { message = null; render(); }, 3000);

        }

        // ====================================

        // RENDER

        // ====================================

        function render() {

            const appEl = document.getElementById('app');

            if (!selectedAdmin) {

                appEl.innerHTML = `

                    <div class="gradient-bg flex items-center justify-center p-4">

                        <div class="glass-card-strong rounded-2xl sm:rounded-3xl shadow-2xl p-6 sm:p-8 max-w-md w-full animate-fade-in">

                            <div class="text-center mb-6 sm:mb-8">

                                <div class="bg-gradient-to-br from-purple-500/20 to-pink-500/20 w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-purple-500/30">

                                    <svg class="w-10 h-10 sm:w-12 sm:h-12 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>

                                    </svg>

                                </div>

                                <h2 class="text-2xl sm:text-3xl font-bold text-white mb-2">Admin Dashboard</h2>

                                <p class="text-slate-400 text-sm sm:text-base">Log in om verder te gaan</p>

                            </div>

                            <div class="space-y-4">

                                <div>

                                    <label class="block text-sm font-medium text-slate-300 mb-2">E-mailadres</label>

                                    <input

                                        type="email"

                                        id="admin-email"

                                        autocomplete="username"

                                        class="w-full px-4 py-3 glass-card rounded-xl text-white border border-white/10 focus:border-purple-500/50 focus:outline-none transition-all"

                                        placeholder="E-mailadres">

                                </div>

                                <div>

                                    <label class="block text-sm font-medium text-slate-300 mb-2">Wachtwoord</label>

                                    <input

                                        type="password"

                                        id="admin-password"

                                        autocomplete="current-password"

                                        class="w-full px-4 py-3 glass-card rounded-xl text-white border border-white/10 focus:border-purple-500/50 focus:outline-none transition-all"

                                        placeholder="Wachtwoord"

                                        onkeydown="if(event.key === 'Enter') window._adminFns.login()">

                                </div>

                                <button

                                    onclick="window._adminFns.login()"

                                    class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white px-6 py-4 rounded-xl hover:from-purple-700 hover:to-pink-700 transition text-base sm:text-lg font-semibold">

                                    Inloggen

                                </button>
