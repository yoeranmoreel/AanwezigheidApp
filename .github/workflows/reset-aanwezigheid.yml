name: Reset aanwezigheid (18:00 NL)

on:
  schedule:
    # GitHub cron uses UTC. Both slots cover Dutch summer/winter time.
    # Live reset only between 18:00 and midnight Dutch time; no morning catch-up.
    - cron: '10 16 * * *'
    - cron: '10 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen controleren, niets wijzigen'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reset-aanwezigheid
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock --ignore-scripts firebase-admin@13
      - name: Reset status in Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node scripts/reset-aanwezigheid.cjs
