<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanwezigheid - Medewerker App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="page-medewerker">

    <div id="app"></div>

    <script type="module">

        import { db, auth, logout as sharedLogout, resolveAccount, prepareAuth } from "./auth.js";
        import { collection, doc, getDocs, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ====================================
        // STATE
        // ====================================
        let medewerkers = [];
        let statusMap = {};
        let loading = true;
        let currentUser = null;
        let currentProfile = null;
        let unsubscribeStatus = null;
        let authMessage = '';

        // ====================================
        // DATA
        // ====================================
        async function loadMedewerkers() {
            if (currentProfile.role !== 'admin') {
                medewerkers = [{ id: currentUser.uid, uid: currentUser.uid, ...currentProfile }]
                    .filter(m => m.displayName && m.zichtbaar !== false && m.role !== 'display');
                return;
            }

            const snapshot = await getDocs(collection(db, 'accounts'));
            medewerkers = snapshot.docs
                .map(d => ({ id: d.id, uid: d.id, ...d.data() }))
                .filter(m => m.displayName && m.zichtbaar !== false && m.role !== 'display')
                .sort((a, b) => a.displayName.localeCompare(b.displayName, 'nl'));
        }

        function listenToStatus() {
            if (unsubscribeStatus) unsubscribeStatus();

            unsubscribeStatus = onSnapshot(collection(db, 'actuele_status'), (snapshot) => {
                statusMap = {};

                snapshot.docs.forEach(d => {
                    const data = d.data();
                    statusMap[d.id] = data.aanwezig === true;
                });

                loading = false;
                render();
            }, (error) => {
                console.error('Status laden mislukt:', error);
                loading = false;
                render();
            });
        }

        // ====================================
        // AUTH
        // ====================================
        async function logout() { await sharedLogout(); location.replace("index.html"); }

        onAuthStateChanged(auth, async user => {
            if (unsubscribeStatus) { unsubscribeStatus(); unsubscribeStatus = null } if (!user) { location.replace("index.html"); return } loading = true; render(); try {
                const account = await resolveAccount(user);
                document.body.classList.toggle("staff-view", account.kind === "medewerker" && account.role !== "admin");
                if (account.kind !== "medewerker") { location.replace("index.html"); return } currentUser = user; currentProfile = { uid: user.uid, ...account.profile }; await loadMedewerkers(); listenToStatus()
            } catch (e) { console.error(e); location.replace("index.html") }
        });

        // ====================================
        // TOGGLE
        // ====================================
        async function toggleStatus(uid) {
            const huidigeStatus = statusMap[uid] === true;
            const nieuweStatus = !huidigeStatus;

            statusMap[uid] = nieuweStatus;
            render();

            try {
                await setDoc(doc(db, 'actuele_status', uid), {
                    aanwezig: nieuweStatus
                });
            } catch (error) {
                statusMap[uid] = huidigeStatus;
                render();
                console.error('Status wijzigen mislukt:', error);
            }
        }

        window.toggleStatus = toggleStatus;
        window.logout = logout;

        // ====================================
        // RENDER
        // ====================================
        function render() {
            const appEl = document.getElementById('app');

            if (loading) {
                appEl.innerHTML = `
        <div class="gradient-bg flex items-center justify-center text-white">
            Laden...
        </div>
        `;
                return;
            }
            if (!currentUser || !currentProfile) { return; }

            appEl.innerHTML = `

    <div class="gradient-bg text-white pb-24">

        <div class="max-w-4xl mx-auto p-4">

            <div class="glass-card rounded-3xl p-6 mb-6">

                <div class="flex items-start justify-between gap-4">
                    <div>
                        <h1 class="text-3xl font-bold mb-2">
                            Aanwezigheid
                        </h1>

                        <p class="text-slate-400">
                            Tik op je naam om je status te wijzigen
                        </p>
                    </div>

                    <div class="text-right">
                        <p class="text-sm text-slate-400">${currentProfile.displayName || ''}</p>
                        <button onclick="logout()" class="text-sm text-blue-400 hover:text-blue-300 underline mt-1">
                            Uitloggen
                        </button>
                    </div>
                </div>

            </div>

            <div class="grid grid-cols-2 gap-4">

            ${medewerkers.map(m => {

                const aanwezig = statusMap[m.uid] === true;
                const status = aanwezig ? 'Aanwezig' : 'Afwezig';

                return `

                <button
                    onclick="toggleStatus('${m.uid}')"
                    class="
                    teacher-card
                    rounded-3xl
                    p-5
                    text-left
                    border-2

                    ${aanwezig
                        ? 'bg-green-500/20 border-green-500/40'
                        : 'bg-red-500/20 border-red-500/40'
                    }

                    glass-card
                    ">

                    <div class="text-2xl font-bold mb-1">

                        ${aanwezig ? '🟢' : '🔴'}
                        ${m.displayName}

                    </div>

                    ${m.functie ? `
                    <div class="text-sm text-slate-400 mb-2">
                        ${m.functie}
                    </div>
                    ` : ''}

                    <div class="text-lg text-slate-300">

                        ${status}

                    </div>

                </button>

                `;

            }).join('')}

            </div>

            <!-- Fixed Bottom Navigation -->
            <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50">
                <div class="max-w-6xl mx-auto px-4 py-3 sm:py-4">
                    <div class="flex items-center justify-around">

                        <a href="medewerker-app.html" class="nav-item flex flex-col items-center gap-1 p-2 rounded-xl group">
                            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            <span class="text-xs text-blue-400">Medewerker</span>
                        </a>

                        <a href="index.html" class="nav-item flex flex-col items-center gap-1 p-2 rounded-xl group">
                            <svg class="w-6 h-6 text-slate-400 group-hover:text-slate-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                            </svg>
                            <span class="text-xs text-slate-400 group-hover:text-slate-300 transition-colors">Home</span>
                        </a>

                        <a href="lichtkrant.html" class="nav-item flex flex-col items-center gap-1 p-2 rounded-xl group">
                            <svg class="w-6 h-6 text-slate-400 group-hover:text-green-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <span class="text-xs text-slate-400 group-hover:text-green-400 transition-colors">Lichtkrant</span>
                        </a>

                        ${currentProfile.role === 'admin' ? `
                        <a href="admin-dashboard.html" class="nav-item flex flex-col items-center gap-1 p-2 rounded-xl group">
                            <svg class="w-6 h-6 text-slate-400 group-hover:text-purple-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            <span class="text-xs text-slate-400 group-hover:text-purple-400 transition-colors">Admin</span>
                        </a>` : ''}

                    </div>
                </div>
            </nav>

        </div>
    </div>
    `;
        }

        prepareAuth().then(() => render());

    </script>

</body>

</html>
